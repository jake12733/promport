<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromptStudio · AI 전용 프롬프트 생성기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#0B0D17;--panel:#151A2C;--panel2:#1C2238;--line:#272E4A;--line2:#343C60;--text:#E9EBF7;--muted:#9AA1C3;--dim:#6B7299;--pri:#7C5CFF;--pri2:#4FD1FF;--ok:#3DDC97;--warn:#FFB547;--grad:linear-gradient(135deg,#7C5CFF,#4FD1FF);--shadow:0 24px 60px -24px rgba(0,0,0,.65);--bar:#1A2033}
[data-theme=light]{--bg:#EEF4FD;--panel:#FFFFFF;--panel2:#F3F6FC;--line:#E1E7F3;--line2:#CFD8EA;--text:#1D2133;--muted:#5D6487;--dim:#8F95B5;--shadow:0 18px 50px -22px rgba(50,80,150,.28);--bar:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
body{min-height:100vh;overflow-x:hidden}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bgfx i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.3;animation:fl 20s ease-in-out infinite}
.bgfx i:nth-child(1){width:560px;height:560px;background:#7C5CFF;top:-200px;left:-140px}
.bgfx i:nth-child(2){width:520px;height:520px;background:#4FD1FF;top:25%;right:-200px;animation-delay:-7s}
[data-theme=light] .bgfx i{opacity:.35}
[data-theme=light] .bgfx i:nth-child(1){background:#C9DBFF}[data-theme=light] .bgfx i:nth-child(2){background:#BDE3FF}
@keyframes fl{50%{transform:translate(40px,30px) scale(1.08)}}
.wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:0 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo .mark{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 22px -6px #7C5CFF}
.hdr{display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.15s}
.ib:hover{background:var(--panel);border-color:var(--line);color:var(--text)}
.ib svg{width:19px;height:19px}
.hero{text-align:center;padding:9vh 0 26px}
.hero h1{font-size:clamp(30px,5vw,44px);font-weight:600;letter-spacing:-.03em}
.hero h1 b{font-weight:700;background:linear-gradient(120deg,#A48BFF,#4FD1FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin-top:12px;font-size:15.5px}
.modes{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.modes button{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:99px;cursor:pointer;transition:.15s}
.modes button:hover{color:var(--text)}
.modes button.on{background:var(--panel);color:var(--text);border-color:var(--line2);box-shadow:var(--shadow)}
.bar{position:relative;display:flex;align-items:flex-end;gap:6px;background:var(--bar);border:1px solid var(--line);border-radius:30px;padding:9px 9px 9px 10px;box-shadow:var(--shadow);transition:.2s}
.bar:focus-within{border-color:var(--line2);box-shadow:0 0 0 4px #7C5CFF1c,var(--shadow)}
.bar textarea{flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:17px;line-height:1.5;resize:none;max-height:220px;min-height:28px;padding:9px 4px}
.bar textarea::placeholder{color:var(--dim)}
.round{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.15s}
.round:hover{background:var(--panel2)}
.round svg{width:22px;height:22px}
.send{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px #7C5CFF}
.send:hover{background:var(--grad);filter:brightness(1.08)}
.send:disabled{opacity:.35;cursor:default;filter:none}
.model{flex:0 0 auto;height:42px;display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--text);font:inherit;font-size:14.5px;font-weight:600;padding:0 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
